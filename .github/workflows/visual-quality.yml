name: Visual quality and mobile performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://ferre-oficial.vercel.app
      AUDIT_BASE_URL: http://localhost:3010
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Prepare temporary report and tool directories
        run: |
          audit_tools_path="$RUNNER_TEMP/ferrepardo-audit-tools"
          audit_reports_path="$RUNNER_TEMP/ferrepardo-visual-quality"
          mkdir -p "$audit_reports_path"
          printf 'AUDIT_TOOLS=%s\n' "$audit_tools_path" >> "$GITHUB_ENV"
          printf 'AUDIT_REPORTS=%s\n' "$audit_reports_path" >> "$GITHUB_ENV"

      - name: Install application from lockfile
        run: npm ci

      - name: Functional checks
        run: |
          npm run lint 2>&1 | tee "$AUDIT_REPORTS/lint.log"
          npm run audit:production 2>&1 | tee "$AUDIT_REPORTS/dependency-audit.log"
          npm run typecheck 2>&1 | tee "$AUDIT_REPORTS/typecheck.log"
          node --test --test-concurrency=1 tests/*.test.cjs scripts/*.test.cjs 2>&1 | tee "$AUDIT_REPORTS/tests.log"

      - name: Install temporary audit tools from the official npm registry
        run: |
          mkdir -p "$AUDIT_TOOLS"
          printf '{"private":true}\n' > "$AUDIT_TOOLS/package.json"
          npm install --prefix "$AUDIT_TOOLS" --registry https://registry.npmjs.org --no-save --package-lock=false --ignore-scripts lighthouse@13.5.0 chrome-launcher@1.2.2 puppeteer-core@25.12.0 axe-core@4.13.0 @puppeteer/browsers@3.2.3
          printf 'NODE_PATH=%s/node_modules\n' "$AUDIT_TOOLS" >> "$GITHUB_ENV"

      - name: Select official Chrome and record the execution context
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome_path" ]; then
            # Official Chrome for Testing fallback, pinned to the stable version verified when this workflow was authored.
            npm exec --prefix "$AUDIT_TOOLS" -- @puppeteer/browsers install chrome@154.0.8037.92 --path "$RUNNER_TEMP/ferrepardo-chrome"
            chrome_path="$RUNNER_TEMP/ferrepardo-chrome/chrome/linux-154.0.8037.92/chrome-linux64/chrome"
          fi
          test -x "$chrome_path"
          printf 'CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version > "$AUDIT_REPORTS/chrome-version.txt"
          node - <<'NODE'
          const fs = require('node:fs'), os = require('node:os');
          fs.writeFileSync(process.env.AUDIT_REPORTS + '/runner-context.json', JSON.stringify({dateUTC:new Date().toISOString(),commit:process.env.GITHUB_SHA,node:process.version,platform:process.platform,architecture:process.arch,cpuCount:os.cpus().length,cpuModel:os.cpus()[0]?.model,totalMemoryBytes:os.totalmem(),runnerImage:process.env.ImageOS,runnerImageVersion:process.env.ImageVersion},null,2)+'\n');
          NODE

      - name: Verify semantic tokens
        id: tokens
        continue-on-error: true
        run: node scripts/verify-visual-tokens.cjs --output "$AUDIT_REPORTS/tokens.json"

      - name: Build production
        run: npm run build 2>&1 | tee "$AUDIT_REPORTS/build.log"

      - name: Serve production on port 3010
        id: server
        run: |
          node node_modules/next/dist/bin/next start --port 3010 --hostname localhost > "$AUDIT_REPORTS/server.log" 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/ferrepardo-production.pid"
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$AUDIT_BASE_URL/catalogo" --output /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Verify SSR, query isolation and canonical HTTP behavior
        id: http
        continue-on-error: true
        run: node scripts/verify-catalog-http.cjs --url "$AUDIT_BASE_URL" --output "$AUDIT_REPORTS/http.json"

      - name: Verify repeated catalog navigation, taxes, filters and quick view
        id: functional
        continue-on-error: true
        run: node scripts/verify-catalog-functional-browser.cjs --base-url "$AUDIT_BASE_URL" --output "$AUDIT_REPORTS/functional" --chrome-path "$CHROME_PATH"

      - name: Verify visual states and the native system-font gate
        id: visual
        continue-on-error: true
        run: node scripts/verify-visual-browser.cjs --base-url "$AUDIT_BASE_URL" --output "$AUDIT_REPORTS/visual" --chrome-path "$CHROME_PATH" --views catalogo,categoria,ficha-foto,ficha-sin-foto,sin-resultados,footer,inicio,cotizacion --widths 390,1440 --themes light,dark --font-preload-gate required

      - name: Verify phase-2/3 captions, stock labels and accessible product media
        id: product_media
        continue-on-error: true
        run: node scripts/verify-product-media-browser.cjs --base-url "$AUDIT_BASE_URL" --output "$AUDIT_REPORTS/product-media" --chrome-path "$CHROME_PATH" --widths 360,1440 --themes light,dark

      - name: Measure mobile Lighthouse on catalog and photographed product
        id: lighthouse
        continue-on-error: true
        run: node scripts/verify-lighthouse-mobile.cjs --base-url "$AUDIT_BASE_URL" --output "$AUDIT_REPORTS/lighthouse" --chrome-path "$CHROME_PATH" --audit-tools "$AUDIT_TOOLS" --runs 1

      - name: Enforce every audit gate
        if: always()
        env:
          TOKENS_OUTCOME: ${{ steps.tokens.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          HTTP_OUTCOME: ${{ steps.http.outcome }}
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          PRODUCT_MEDIA_OUTCOME: ${{ steps.product_media.outcome }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const gates = ['TOKENS_OUTCOME','SERVER_OUTCOME','HTTP_OUTCOME','FUNCTIONAL_OUTCOME','VISUAL_OUTCOME','PRODUCT_MEDIA_OUTCOME','LIGHTHOUSE_OUTCOME'].map(name => ({gate:name,outcome:process.env[name] || 'not-run'}));
          const passed = gates.every(gate => gate.outcome === 'success');
          const reports = process.env.AUDIT_REPORTS || path.join(process.env.RUNNER_TEMP,'ferrepardo-visual-quality');
          fs.mkdirSync(reports,{recursive:true});
          fs.writeFileSync(path.join(reports,'workflow-gates.json'),JSON.stringify({passed,gates},null,2)+'\n');
          console.log(JSON.stringify({passed,gates}));
          if (!passed) process.exitCode = 1;
          NODE

      - name: Upload complete evidence even when an audit fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ferrepardo-visual-quality
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

      - name: Stop the local production server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ferrepardo-production.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ferrepardo-production.pid")" || true
          fi
